version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bratislava"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bratislava"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
    groups:
      npm-dependencies:
        patterns:
          - "*"
